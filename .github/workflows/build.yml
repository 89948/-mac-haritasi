name: Android APK Oluştur

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Proje dosyalarını al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Sistem paketlerini kur
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf automake libtool \
            pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev patch

      - name: Buildozer kur
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "buildozer==1.6.0" \
            "Cython==0.29.34" \
            setuptools virtualenv

      - name: APK oluştur
        run: buildozer -v android debug

      - name: APK dosyasını sakla
        uses: actions/upload-artifact@v4
        with:
          name: mac-haritasi-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 7
